name: Actualizar torneos

on:
  schedule:
    # Se ejecuta todos los días a las 6:00 UTC (~8:00 en España en verano)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # esto permite lanzarlo también a mano desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python main.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Actualizar torneos"
          git push
